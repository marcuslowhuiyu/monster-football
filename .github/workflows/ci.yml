name: CI

# Minutes budget (ADR-017): CI runs on pull requests only — a PR is rebased on main before merging, so the merged
# tree is the tested tree and re-running on push to main would only repeat it. Docs-only PRs skip CI.
# Run manually (workflow_dispatch) when needed.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore MonsterFootball.slnx --locked-mode
      - run: dotnet format MonsterFootball.slnx --verify-no-changes --no-restore

  # Ubuntu runs the full test suite. Windows and macOS (billed at 2x and 10x) only build the debug runner and
  # produce match fingerprints: their job is the cross-platform determinism check (ADR-013), which is all they add.
  build-test:
    name: ${{ matrix.tests && 'Build & test' || 'Build & fingerprint' }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tests: true
          - os: windows-latest
            tests: false
          - os: macos-latest
            tests: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (locked)
        run: dotnet restore ${{ matrix.tests && 'MonsterFootball.slnx' || 'src/MonsterFootball.DebugRunner' }} --locked-mode

      - name: Build
        run: dotnet build ${{ matrix.tests && 'MonsterFootball.slnx' || 'src/MonsterFootball.DebugRunner' }} -c Release --no-restore

      - name: Test
        if: matrix.tests
        run: >
          dotnet test MonsterFootball.slnx -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Match fingerprints
        shell: bash
        run: |
          dotnet run --project src/MonsterFootball.DebugRunner -c Release --no-build -- fingerprint 1 2 3 4 5 123456 \
            | tr -d '\r' > fingerprint-${{ matrix.os }}.txt
          cat fingerprint-${{ matrix.os }}.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && matrix.tests
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fingerprint-${{ matrix.os }}
          path: fingerprint-${{ matrix.os }}.txt
          retention-days: 14

  batch:
    name: Batch (1,000 matches)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore MonsterFootball.slnx --locked-mode
      - run: dotnet build src/MonsterFootball.DebugRunner -c Release --no-restore
      - name: Run 1,000 headless matches and health checks
        shell: bash
        run: |
          set -o pipefail
          dotnet run --project src/MonsterFootball.DebugRunner -c Release --no-build -- batch 1000 | tee batch-report.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: batch-report
          path: batch-report.txt
          retention-days: 30

  cross-platform-determinism:
    name: Cross-platform determinism
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fingerprint-*
          merge-multiple: true
      - name: Compare fingerprints across operating systems
        shell: bash
        run: |
          ls fingerprint-*.txt
          reference=fingerprint-ubuntu-latest.txt
          status=0
          for f in fingerprint-*.txt; do
            if ! diff -u "$reference" "$f"; then
              echo "::error::$f differs from $reference — the same seed played a different match on another OS (ADR-013)."
              status=1
            fi
          done
          exit $status
