name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore MonsterFootball.slnx --locked-mode
      - run: dotnet format MonsterFootball.slnx --verify-no-changes --no-restore

  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (locked)
        run: dotnet restore MonsterFootball.slnx --locked-mode

      - name: Build
        run: dotnet build MonsterFootball.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test MonsterFootball.slnx -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Match fingerprints
        shell: bash
        run: |
          dotnet run --project src/MonsterFootball.DebugRunner -c Release --no-build -- fingerprint 1 2 3 4 5 123456 \
            | tr -d '\r' > fingerprint-${{ matrix.os }}.txt
          cat fingerprint-${{ matrix.os }}.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fingerprint-${{ matrix.os }}
          path: fingerprint-${{ matrix.os }}.txt
          retention-days: 14

  cross-platform-determinism:
    name: Cross-platform determinism
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fingerprint-*
          merge-multiple: true
      - name: Compare fingerprints across operating systems
        shell: bash
        run: |
          ls fingerprint-*.txt
          reference=fingerprint-ubuntu-latest.txt
          status=0
          for f in fingerprint-*.txt; do
            if ! diff -u "$reference" "$f"; then
              echo "::error::$f differs from $reference — the same seed played a different match on another OS (ADR-013)."
              status=1
            fi
          done
          exit $status
